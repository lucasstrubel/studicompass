# Local Moodle sandbox for StudiCompass (see docs/adr/0001-eigene-moodle-instanz.md).
# Only reachable from this machine; all accounts and keys below are example values.
name: studicompass-moodle

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 3s
      timeout: 3s
      retries: 30

  moodle:
    build:
      context: .
      args:
        MOODLE_BRANCH: ${MOODLE_BRANCH:-MOODLE_405_STABLE}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MOODLE_PORT:-8080}:80"
    environment:
      MOODLE_WWWROOT: http://localhost:${MOODLE_PORT:-8080}
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: moodle
      MOODLE_ADMIN_PASSWORD: Sandbox-2026!
      SEED_USER_PASSWORD: Sandbox-2026!
      SEED_STUDENT_TOKEN: 5c0de5a1dbeef0000000000000000001
    volumes:
      - moodledata:/var/www/moodledata
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /var/www/moodledata/.seeded && curl -fsS http://localhost/login/index.php > /dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s

volumes:
  db:
  moodledata:
