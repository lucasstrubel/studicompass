# Local mail sandbox for StudiCompass (see docs/adr/0005-bruecke-fuer-pos-und-mail.md).
# GreenMail is a mail server made for tests: it keeps everything in memory and delivers nothing.
# Only reachable from this machine; the account below is an example value.
name: studicompass-mail

services:
  mail:
    image: greenmail/standalone:2.1.15
    ports:
      - "127.0.0.1:${MAIL_IMAP_PORT:-3143}:3143"
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=2212345:Sandbox-2026@stud.example
        -Dgreenmail.users.login=local_part
