version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # Minor and patch updates arrive as one pull request; majors stay separate, each needs a look.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: /infra/moodle
    schedule:
      interval: monthly
    commit-message:
      prefix: chore

  - package-ecosystem: docker-compose
    directory: /infra/mail
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
